name: mipix_app
description: "MiPix 米影相册 - 纯本地相册管理与 SMB 备份"
publish_to: 'none'
version: 1.0.14+15

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  share_plus: ^10.0.0
  exif: ^3.3.0
  photo_manager: ^3.6.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  smb_connect: ^0.0.8+1
  path_provider: ^2.1.0
  path: ^1.9.0
  image: ^4.0.0
  video_player: ^2.9.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

# 本地补丁版 smb_connect：抬高 64KiB 单消息硬上限（见 packages/smb_connect 内注释）
dependency_overrides:
  smb_connect:
    path: packages/smb_connect

flutter:
  uses-material-design: true